name: Verify software and manuals
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]' build
      - name: CPU regression suite
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m pytest -q --junitxml=results/cpu.xml
      - run: python -m build --outdir build/dist
      - name: Clean wheel installation and portable examples
        run: |
          python -m venv /tmp/garnet-wheel
          /tmp/garnet-wheel/bin/python -m pip install build/dist/*.whl
          mkdir -p /tmp/garnet-wheel-run/examples
          cp -R examples/isonees_features /tmp/garnet-wheel-run/examples/
          cp -R examples/branch_xs /tmp/garnet-wheel-run/examples/
          cd /tmp/garnet-wheel-run
          /tmp/garnet-wheel/bin/python -I -c "import garnet; assert '/tmp/garnet-wheel/' in garnet.__file__"
          /tmp/garnet-wheel/bin/python -I examples/isonees_features/common_mesh_fv.py
          /tmp/garnet-wheel/bin/python -I examples/isonees_features/nem_local_reference.py
          /tmp/garnet-wheel/bin/python -I examples/isonees_features/static_kinetics.py
          /tmp/garnet-wheel/bin/python -I examples/isonees_features/branch_xs.py
          /tmp/garnet-wheel/bin/python -I examples/branch_xs/thermal_star.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpu-${{ matrix.python }}
          path: results/cpu.xml
  manuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements-build.txt '.[docs]'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -M latexpdf docs docs/_build -W --keep-going
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: garnet-manuals
          path: |
            docs/_build/html
            docs/_build/latex/garnet-user-manual.pdf
            docs/_build/latex/garnet-methodology-manual.pdf
