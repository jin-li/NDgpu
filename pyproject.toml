[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ndgpu"
version = "0.1.0"
description = "GPU-native multigroup neutron diffusion k-eigenvalue solver for reactor physics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mario Poncet" }]
keywords = ["neutron diffusion", "reactor physics", "GPU", "CUDA", "criticality", "k-eigenvalue"]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
# CUDA component wheels for hosts without a system-wide toolkit (e.g. NixOS).
cuda12-ctk = ["cupy-cuda12x[ctk]>=14"]
cuda11 = ["cupy-cuda11x"]
rocm = ["cupy-rocm-7-0==14.2.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
test = ["pytest"]
# External multiphysics coupling (examples/precice). Optional: the internal
# CoupledSolver never touches preCICE. NOTE pyprecice is source-only on PyPI
# and links against the system libprecice; install both from conda-forge if
# that library is missing or ABI-incompatible -- see docs/coupling.md.
precice = ["pyprecice>=3"]

# CuPy distributions install the same module; only one GPU family may be synced.
[tool.uv]
conflicts = [
    [{ extra = "rocm" }, { extra = "cuda11" }],
    [{ extra = "rocm" }, { extra = "cuda12" }],
    [{ extra = "rocm" }, { extra = "cuda12-ctk" }],
    [{ extra = "cuda11" }, { extra = "cuda12" }],
    [{ extra = "cuda11" }, { extra = "cuda12-ctk" }],
]

[tool.setuptools.packages.find]
include = ["ndgpu*"]

[tool.setuptools.package-data]
# Vendored cross-section libraries: without this they are dropped when the
# source zip is pip-installed (e.g. in Colab) and the HP-MR benchmarks fail.
"ndgpu.benchmarks" = ["data/*.npz"]

[tool.pytest.ini_options]
markers = [
    "slow: expensive full-core solves (deselected by default; run with -m slow)",
]
addopts = "-m 'not slow'"
